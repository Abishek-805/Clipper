<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper candidate review</title>
<style>
body{font:15px system-ui,sans-serif;background:#111827;color:#e5e7eb;margin:0}header{position:sticky;top:0;background:#111827;padding:12px 4vw;z-index:2;border-bottom:1px solid #374151}h1{font-size:22px;margin:0}button,label{cursor:pointer}main{max-width:1200px;margin:18px auto;padding:0 16px}.card{display:grid;grid-template-columns:minmax(280px,40%) 1fr;gap:18px;background:#1f2937;border:1px solid #374151;border-radius:12px;padding:16px;margin:16px 0}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.frames img{width:100%;background:#030712}.meta{color:#9ca3af;font-size:13px}.evidence{font:12px ui-monospace,monospace;white-space:pre-wrap;color:#a7f3d0}video{width:100%;max-height:250px}.controls{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:8px;margin-top:10px}select,input,textarea{background:#111827;color:#f9fafb;border:1px solid #4b5563;padding:7px;border-radius:5px}textarea{width:98%;min-height:42px}.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;font-size:12px}.reasons{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}.reasons label{display:flex;align-items:center}#status{color:#a7f3d0;margin-left:12px}@media(max-width:750px){.card{grid-template-columns:1fr}.controls,.ratings{grid-template-columns:repeat(2,1fr)}}
</style>
<header><h1>Clipper · anime candidate review</h1><div id="summary"></div><p>Export the annotation JSON periodically to keep a portable backup of your labels.</p><button id="export">Export annotations JSON</button> <label>Import dataset <input id="import" type="file" accept="application/json"></label><span id="status"></span></header>
<main id="cards"></main>
<script>
const dataset=__DATA__, key='clipper-review-v2:'+dataset.source.fingerprint, reasons=['Studio logo or title','Opening sequence','Ending credits','Ordinary dialogue','Cut-off dialogue','No context','No payoff','Low-interest scene','Duplicate candidate','Caption error','Unclear/uncertain'], categories=['Action','Comedy','Emotional','Drama','Suspense','Memorable dialogue','Reveal','Cliffhanger','Other','Unclassified'], ratings=['hook','context','coherence','impact','payoff','audio_clarity','visual_clarity','caption_accuracy','overall'];
let annotations=JSON.parse(localStorage.getItem(key)||'{}'), drafts=JSON.parse(localStorage.getItem(key+':drafts')||'{}'); for(const a of dataset.annotations||[]){annotations[a.candidate_id]=a;drafts[a.candidate_id]=a;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(annotations));localStorage.setItem(key+':drafts',JSON.stringify(drafts));document.querySelector('#status').textContent='Saved in this browser';document.querySelector('#summary').textContent=`${dataset.source.filename} · ${dataset.candidates.length} review moments · ${dataset.review_sampling.duplicate_proposals_removed} overlapping proposals skipped · ${Object.keys(annotations).length} annotated`;}
function draw(){document.querySelector('#summary').textContent=`${dataset.source.filename} · ${dataset.candidates.length} review moments · ${dataset.review_sampling.duplicate_proposals_removed} overlapping proposals skipped · ${Object.keys(annotations).length} annotated`;document.querySelector('#cards').innerHTML=dataset.candidates.map(c=>{let a=drafts[c.candidate_id]||annotations[c.candidate_id]||{}, sel=(name,values,current)=>`<select data-field="${name}"><option value="">— choose —</option>${values.map(v=>`<option ${current===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;return `<section class="card" data-id="${esc(c.candidate_id)}"><div><div class="frames">${[c.frames?.[0],c.frames?.[1],c.frames?.[2]].map(x=>x?`<img src="${esc(x)}" alt="Representative frame">`:'').join('')}</div><video controls preload="none" src="${esc(c.preview||'')}"></video><div class="meta">${c.preview_audio_available?`Audio: source stream ${c.audio_stream_index} (${esc(c.audio_language||'language unknown')})`:'Audio unavailable for preview'}</div><div class="meta">${c.start.toFixed(2)}–${c.end.toFixed(2)}s · ${c.duration.toFixed(1)}s · ${esc(c.predicted_category)} · ${esc(c.score_label||'signal score')} ${Number(c.score).toFixed(3)}${c.selected?' · selected':''}${c.baseline?' · existing production':''}</div><p>${esc(c.transcript_excerpt||'(no transcript)')}</p><div class="evidence">${esc(c.event_summary||JSON.stringify({reason:c.reason,sources:c.sources,evidence:c.evidence},null,2))}</div></div><div><b>${esc(c.candidate_id)}</b><p>Temporal cluster ${esc(c.review_cluster_id)} · ${c.review_cluster_size} proposal(s). ${c.alternate_candidates?.length?'Alternates: '+c.alternate_candidates.map(x=>`${esc(x.candidate_id)} ${x.start.toFixed(1)}–${x.end.toFixed(1)}s`).join(', '):'No duplicate proposals'}</p><div class="controls">${sel('decision',['keep','reject','maybe'],a.decision)}${sel('category',categories,a.category)}<label>Corrected start<input data-field="corrected_start" type="number" step="0.01" value="${esc(a.corrected_start??'')}"></label><label>Corrected end<input data-field="corrected_end" type="number" step="0.01" value="${esc(a.corrected_end??'')}"></label></div><h4>Quality ratings (1–5)</h4><div class="ratings">${ratings.map(r=>`<label>${r.replaceAll('_',' ')} <input data-rating="${r}" type="number" min="1" max="5" value="${esc(a.ratings?.[r]??'')}"></label>`).join('')}</div><h4>Rejection reasons</h4><div class="reasons">${reasons.map(r=>`<label><input data-reason="${esc(r)}" type="checkbox" ${(a.rejection_reasons||[]).includes(r)?'checked':''}>${esc(r)}</label>`).join('')}</div><h4>Notes</h4><textarea data-field="notes">${esc(a.notes||'')}</textarea></div></section>`}).join('');document.querySelectorAll('.card').forEach(card=>card.addEventListener('change',()=>{const id=card.dataset.id,c=dataset.candidates.find(x=>x.candidate_id===id),a=drafts[id]||annotations[id]||{candidate_id:id,ratings:{},rejection_reasons:[]};a.source_fingerprint=dataset.source.fingerprint;a.source_interval=[c.start,c.end];card.querySelectorAll('[data-field]').forEach(e=>{if(e.value==='')delete a[e.dataset.field];else if(e.type==='number')a[e.dataset.field]=Number(e.value);else a[e.dataset.field]=e.value});if(a.corrected_start===undefined||a.corrected_end===undefined){delete a.corrected_start;delete a.corrected_end}a.ratings={};card.querySelectorAll('[data-rating]').forEach(e=>{if(e.value)a.ratings[e.dataset.rating]=Number(e.value)});a.rejection_reasons=[...card.querySelectorAll('[data-reason]:checked')].map(e=>e.dataset.reason);a.annotated_at=new Date().toISOString();drafts[id]=a;if(a.decision&&a.category)annotations[id]=a;else delete annotations[id];save()}));}
document.querySelector('#export').onclick=()=>{dataset.annotations=Object.values(annotations);const blob=new Blob([JSON.stringify(dataset,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='anime_highlight_dataset.json';a.click();URL.revokeObjectURL(a.href)};
document.querySelector('#import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==dataset.schema||d.source.fingerprint!==dataset.source.fingerprint)throw Error('Source or schema does not match this review board');for(const a of d.annotations){const c=dataset.candidates.find(x=>x.candidate_id===a.candidate_id);if(!c||JSON.stringify(a.source_interval)!==JSON.stringify([c.start,c.end]))throw Error('Candidate timings differ from this review board')}annotations=Object.fromEntries(d.annotations.map(a=>[a.candidate_id,a]));drafts={...annotations};save();draw()}catch(err){alert('Could not import: '+err.message)}};
draw();const labelFrameTimes=()=>document.querySelectorAll('.card').forEach(card=>{if(card.querySelector('.frame-times'))return;const c=dataset.candidates.find(x=>x.candidate_id===card.dataset.id),label=document.createElement('div');label.className='meta frame-times';label.textContent='Evidence frames at '+(c.frame_timestamps||[]).map(t=>Number(t).toFixed(2)+'s').join(', ');card.querySelector('.frames').after(label)});labelFrameTimes();new MutationObserver(labelFrameTimes).observe(document.querySelector('#cards'),{childList:true});
</script></html>
